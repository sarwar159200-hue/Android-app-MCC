name: Build MCCS Android APK

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MCCS-Android-Mobile-Usability-Update-Under-100-Files/MCCS2151/mobile-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: MCCS-Android-Mobile-Usability-Update-Under-100-Files/MCCS2151/mobile-app/package-lock.json

      - run: npm ci
      - run: npm run sync

      - name: Build APK
        working-directory: MCCS-Android-Mobile-Usability-Update-Under-100-Files/MCCS2151/mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MCCS-Android-APK
          path: MCCS-Android-Mobile-Usability-Update-Under-100-Files/MCCS2151/mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
