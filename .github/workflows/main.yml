name: Build MCCS Android APK

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Find Android project
        run: |
          ANDROID_DIR="$(find "$GITHUB_WORKSPACE" -type f -path '*/android/gradlew' -print -quit | xargs -r dirname)"
          test -n "$ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MCCS-Android-APK
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          retention-days: 30
