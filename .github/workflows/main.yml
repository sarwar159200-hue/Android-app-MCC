name: Build MCCS Android APK

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Find MCCS mobile application
        run: |
          MCCS_APP_DIR="$(find "$GITHUB_WORKSPACE" -type f -path '*/mobile-app/package.json' -print -quit | xargs -r dirname)"
          test -n "$MCCS_APP_DIR"
          echo "MCCS_APP_DIR=$MCCS_APP_DIR" >> "$GITHUB_ENV"
          echo "Mobile application found at: $MCCS_APP_DIR"

      - name: Install dependencies
        run: |
          cd "$MCCS_APP_DIR"
          npm ci

      - name: Synchronize Android project
        run: |
          cd "$MCCS_APP_DIR"
          npm run sync

      - name: Build APK
        run: |
          cd "$MCCS_APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MCCS-Android-APK
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          retention-days: 30
