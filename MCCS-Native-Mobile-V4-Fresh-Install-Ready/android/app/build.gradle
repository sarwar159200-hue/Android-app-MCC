plugins {
    id 'com.android.application'
}

android {
    namespace 'com.miranenergy.mccs'
    compileSdk 35

    defaultConfig {
        // Deliberately a new package ID. Android will install this as a new app
        // instead of silently leaving the earlier web-only MCCS APK in place.
        applicationId 'com.miranenergy.mccs.mobile'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '4.0.0'
    }
}
